font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
font_size        11.5

background_opacity       0.60


include matugen-colors.conf


# Crusor
cursor_trail 10
cursor_trail_start_threshold 0
cursor_trail_decay 0.01 0.05
enable_audio_bell       no
cursor_shape            block
cursor_blink true
scrollback_lines        10000

term tmux-256color

