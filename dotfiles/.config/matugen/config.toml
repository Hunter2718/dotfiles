[config.wallpaper]
command = "swww"
arguments = ["img", "--transition-type", "center", "--transition-step", "15"]
set = true


[templates.waybar]
input_path = './templates/waybar-colors.css'
output_path = '~/.config/waybar/matugen-colors.css'
post_hook = 'pkill -SIGUSR2 waybar'


[templates.fuzzel]
input_path = './templates/fuzzel-colors.ini'
output_path = '~/.config/fuzzel/fuzzel.ini'


[templates.eww]
input_path = './templates/eww-colors.css'
output_path = '~/.config/eww/matugen-colors.css'
post_hook = 'eww reload'


[templates.kitty]
input_path = './templates/kitty-colors.conf'
output_path = '~/.config/kitty/matugen-colors.conf'
post_hook = 'kill -SIGUSR1 $(pidof kitty)'


[templates.hyprland]
input_path = './templates/hyprland-colors.conf'
output_path = '~/.config/hypr/matugen-colors.conf'
post_hook = 'hyprctl reload'


[templates.mako]
input_path = './templates/mako-colors'
output_path = '~/.config/mako/config'
post_hook = 'pkill -SIGUSR2 mako'
