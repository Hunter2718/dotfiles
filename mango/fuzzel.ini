[main]
font=JetBrainsMono Nerd Font:size=18
prompt="❯ "
lines=10
width=40
horizontal-pad=24
vertical-pad=14
inner-pad=8
anchor=center
layer=overlay
icons-enabled=yes
show-actions=yes
match-mode=fzf
fields=filename,name,generic,exec,categories,keywords
terminal=foot -e

[colors]
background=1a1b26f2
text=c0caf5ff
prompt=7dcfffff
placeholder=565f89ff
input=c0caf5ff
match=bb9af7ff
selection=1b1b2bff
selection-text=7dcfffff
selection-match=7dcfffff
border=7dcfffff

[border]
width=2
radius=12
selection-radius=8
